
# ============================================================
# React CI/CD Pipeline
# ============================================================
#
# This workflow does two major things:
#
# CI = Continuous Integration
# --------------------------------
# 1. Get the source code
# 2. Install Node.js
# 3. Install dependencies
# 4. Run tests
# 5. Build the React application
#
# CD = Continuous Deployment
# --------------------------------
# 6. Upload the production build
# 7. Deploy it to GitHub Pages
#
#
# We are using ONLY official GitHub Actions:
#
#   actions/checkout
#   actions/setup-node
#   actions/configure-pages
#   actions/upload-pages-artifact
#   actions/deploy-pages
#
# No JamesIves or other third-party deployment action.
#
# ============================================================


# ============================================================
# WORKFLOW NAME
# ============================================================
#
# This is the name you'll see under:
#
# GitHub repository
#      ↓
# Actions
#
# You'll see:
#
#   React CI/CD Pipeline
#

name: React CI/CD Pipeline


# ============================================================
# WHEN DOES THIS WORKFLOW RUN?
# ============================================================
#
# We have two triggers.
#
# 1. PUSH
#
#    Run when code is pushed to the main branch.
#
#    Example:
#
#       git push origin main
#
#    This will eventually:
#
#       Test → Build → Deploy
#
#
# 2. PULL REQUEST
#
#    Run when a Pull Request targets main.
#
#    Example:
#
#       feature/login
#             ↓
#       Pull Request
#             ↓
#           main
#
#    This lets us test the code before merging it.
#
#    IMPORTANT:
#
#    Pull Requests will NOT deploy because our deploy job
#    contains an additional condition.
#

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ============================================================
# PERMISSIONS
# ============================================================
#
# GitHub Actions uses a special GITHUB_TOKEN to interact
# with your repository and GitHub services.
#
# We explicitly give this workflow the permissions it needs.
#
# contents: read
# ----------------
# Allows the workflow to read your repository's source code.
#
#
# pages: write
# ----------------
# Allows the workflow to publish your website to
# GitHub Pages.
#
#
# id-token: write
# ----------------
# GitHub Pages deployment uses an OIDC identity token to
# securely authenticate the deployment.
#
# GitHub's official documentation requires at least
# pages: write and id-token: write for deploy-pages.
#

permissions:
  contents: read
  pages: write
  id-token: write


# ============================================================
# JOBS
# ============================================================
#
# A workflow contains jobs.
#
# We are going to have TWO jobs:
#
#
#   build
#      |
#      | successful?
#      v
#   deploy
#
#
# The deploy job will NOT start until the build job succeeds.
#

jobs:


  # ==========================================================
  # JOB 1 — BUILD AND TEST
  # ==========================================================
  #
  # This is our CI job.
  #
  # It checks whether our application can:
  #
  #   1. Be downloaded
  #   2. Install its dependencies
  #   3. Pass its tests
  #   4. Be built successfully
  #

  build:

    # --------------------------------------------------------
    # RUNNER
    # --------------------------------------------------------
    #
    # GitHub gives this job a temporary Ubuntu Linux machine.
    #
    # The machine starts fresh for this workflow run.
    #

    runs-on: ubuntu-latest


    # --------------------------------------------------------
    # STEPS
    # --------------------------------------------------------
    #
    # Steps run from top to bottom.
    #

    steps:


      # ======================================================
      # STEP 1 — CHECKOUT SOURCE CODE
      # ======================================================
      #
      # The GitHub runner starts with your repository files
      # unavailable locally.
      #
      # checkout downloads your repository into the runner.
      #
      # After this step the runner can access:
      #
      #   package.json
      #   package-lock.json
      #   src/
      #   public/
      #   etc.
      #

      - name: Checkout repository
        uses: actions/checkout@v6


      # ======================================================
      # STEP 2 — SET UP NODE.JS
      # ======================================================
      #
      # React's build tools run using Node.js.
      #
      # We explicitly tell GitHub which Node.js version
      # our project should use.
      #
      # This makes the environment predictable.
      #

      - name: Set up Node.js
        uses: actions/setup-node@v6

        with:

          # The Node.js version used by this workflow.

          node-version: 18


          # Enable npm dependency caching.
          #
          # This can make future workflow runs faster because
          # npm packages can be reused from GitHub's cache.

          cache: npm


      # ======================================================
      # STEP 3 — INSTALL DEPENDENCIES
      # ======================================================
      #
      # npm ci installs the dependencies defined in
      # package-lock.json.
      #
      # This is commonly used in CI because it provides a
      # clean and reproducible dependency installation.
      #
      # Example:
      #
      # package.json
      #       +
      # package-lock.json
      #       |
      #       v
      #     npm ci
      #       |
      #       v
      #   node_modules/
      #

      - name: Install dependencies
        run: npm ci


      # ======================================================
      # STEP 4 — RUN TESTS
      # ======================================================
      #
      # This runs the test command defined in package.json.
      #
      # For example:
      #
      #   "scripts": {
      #       "test": "react-scripts test"
      #   }
      #
      # --watchAll=false is useful in CI because we don't want
      # the test runner to keep watching files forever.
      #
      # We want:
      #
      #   Start
      #     ↓
      #   Run tests
      #     ↓
      #   Finish
      #

      - name: Run tests
        run: npm test -- --watchAll=false


      # ======================================================
      # STEP 5 — BUILD REACT APPLICATION
      # ======================================================
      #
      # This creates the production version of the React app.
      #
      # The command comes from package.json:
      #
      #   npm run build
      #
      # With Create React App, the result is normally:
      #
      #   build/
      #
      # Conceptually:
      #
      #   src/
      #     ↓
      #   React build process
      #     ↓
      #   build/
      #
      # The build directory contains the static files that
      # GitHub Pages will eventually serve.
      #

      - name: Build React app
        run: npm run build


      # ======================================================
      # STEP 6 — PREPARE GITHUB PAGES
      # ======================================================
      #
      # This is an official GitHub Action.
      #
      # It prepares the workflow/environment for GitHub Pages.
      #
      # This is different from the old approach where we pushed
      # files to a "gh-pages" branch ourselves.
      #
      # With the modern GitHub Pages deployment system:
      #
      #   build/
      #      ↓
      #   GitHub Pages artifact
      #      ↓
      #   deploy-pages
      #      ↓
      #   GitHub Pages
      #

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      # ======================================================
      # STEP 7 — UPLOAD BUILD AS A PAGES ARTIFACT
      # ======================================================
      #
      # An artifact is a collection of files produced by a
      # workflow that can be passed between jobs.
      #
      # Our build job created:
      #
      #   build/
      #
      # We now package that directory as a GitHub Pages
      # artifact.
      #
      # IMPORTANT:
      #
      # We are NOT deploying yet.
      #
      # We are saying:
      #
      #   "GitHub, here are the files that should become
      #    my website."
      #

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4

        with:

          # For Create React App:
          #
          #   build/
          #
          # This is the directory created by npm run build.

          path: ./build


  # ==========================================================
  # JOB 2 — DEPLOY
  # ==========================================================
  #
  # This is our CD job.
  #
  # It takes the artifact created by the build job and
  # publishes it to GitHub Pages.
  #

  deploy:

    # --------------------------------------------------------
    # DEPENDS ON BUILD
    # --------------------------------------------------------
    #
    # This is extremely important.
    #
    # "needs: build" means:
    #
    #   DO NOT start this job until the "build" job finishes.
    #
    # If build fails:
    #
    #   build ❌
    #      ↓
    #   deploy does NOT run
    #
    # If build succeeds:
    #
    #   build ✅
    #      ↓
    #   deploy starts
    #

    needs: build


    # --------------------------------------------------------
    # ONLY DEPLOY PUSHES TO MAIN
    # --------------------------------------------------------
    #
    # We don't want a Pull Request to publish the website.
    #
    # Therefore:
    #
    #   Pull Request → build/test only
    #
    #   Push to main → build/test + deploy
    #
    # github.event_name tells us what triggered the workflow.
    #
    # For example:
    #
    #   push
    #   pull_request
    #
    #

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'


    # --------------------------------------------------------
    # RUNNER
    # --------------------------------------------------------
    #
    # The deploy job gets its own GitHub-hosted runner.
    #

    runs-on: ubuntu-latest


    # --------------------------------------------------------
    # GITHUB PAGES ENVIRONMENT
    # --------------------------------------------------------
    #
    # "github-pages" is the deployment environment used by
    # GitHub Pages.
    #
    # The deployment action will expose the published site's
    # URL as:
    #
    #   steps.deployment.outputs.page_url
    #
    # GitHub can then display that URL in the Actions run.
    #

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    # --------------------------------------------------------
    # DEPLOYMENT STEP
    # --------------------------------------------------------

    steps:

      # ======================================================
      # STEP 8 — DEPLOY TO GITHUB PAGES
      # ======================================================
      #
      # This is an official GitHub Action.
      #
      # It takes the Pages artifact created by the build job
      # and publishes it.
      #
      # Notice that we don't specify:
      #
      #   branch: gh-pages
      #
      # That's because this modern deployment approach does
      # NOT require us to manually maintain a gh-pages branch.
      #
      # GitHub Pages handles the deployment for us.
      #

      - name: Deploy to GitHub Pages

        # "id" gives this step a name that other parts of
        # the workflow can reference.
        #
        # That's why the environment URL above can use:
        #
        #   steps.deployment.outputs.page_url

        id: deployment

        uses: actions/deploy-pages@v4